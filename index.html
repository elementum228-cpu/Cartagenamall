    <title>MallPlay Cartagena</title>
    <script>
      // Restaura la ruta guardada por 404.html (enlaces directos en GitHub Pages): /?/local/A-03 → /local/A-03
      ;(function (l) {
        if (l.search[1] === '/') {
          var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
          window.history.replaceState(null, null, l.pathname.replace(/\/$/, '') + d + l.hash)
        }
      })(window.location)
    </script>
