name: Publicar Cartagena Mall en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # El sitio vive en https://<usuario>.github.io/<repositorio>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Proyecto Supabase de producción. La clave publishable es pública (las reglas RLS protegen
          # los datos); nunca pongas aquí la clave secreta. Se puede reemplazar con variables del
          # repositorio (Settings → Secrets and variables → Actions → Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ccdrxnpoqsniiaeygqhb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_bxk4Pytn9kX48-Cu3Al7Ig_pvMnA7nu' }}
      # Presentación privada por invitación: otra compilación del mismo código (VITE_DEMO=1) que se publica
      # en la subcarpeta presentacion/ del mismo sitio. No incluye la app: solo la puerta con código.
      - run: npx vite build --outDir dist/presentacion --emptyOutDir false
        env:
          VITE_DEMO: '1'
          VITE_BASE: /${{ github.event.repository.name }}/presentacion/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ccdrxnpoqsniiaeygqhb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_bxk4Pytn9kX48-Cu3Al7Ig_pvMnA7nu' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
