<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MallPlay Cartagena</title>
    <script>
      // GitHub Pages no conoce las rutas de la app (/local/A-03): esta página lleva a la raíz del sitio con la ruta
      // guardada en la dirección, y index.html la restaura. En un dominio propio (raíz) no se conserva ninguna carpeta.
      var keep = location.hostname.endsWith('github.io') ? 1 : 0
      var l = location
      var path = l.pathname.split('/').slice(0, 1 + keep).join('/')
      var rest = l.pathname.split('/').slice(1 + keep).join('/')
      l.replace(l.protocol + '//' + l.host + path + '/?/' + rest.replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash)
    </script>
  </head>
  <body></body>
</html>
